<!-- ejorr blueprint library. One file, two uses:
     pages: inline it (hidden) and draw with <svg><use href="#d-module"/></svg>;
     gen_pattern.py sheet: reads these symbols to compose drawing sheets.
     Lines are currentColor; the highlighted part is the CSS custom property hl. Icons: i-*, 24 grid.
     Drawings: d-* (200x150) with a d-*-dims annotation layer; sheet-frame is the grid + title block. -->
